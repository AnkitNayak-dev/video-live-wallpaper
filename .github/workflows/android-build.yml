name: Android build and pre-release

on:
  push:
    branches:
      - main
      - "feature/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests and assemble debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew test assembleDebug

      - name: Upload debug APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Video-Live-Wallpaper-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Prepare APK for GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/*.apk "release/VideoLiveWallpaper-OneShot-${GITHUB_REF_NAME}.apk"

      - name: Publish GitHub pre-release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Video Live Wallpaper OneShot ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          prerelease: true
          generate_release_notes: true
          files: release/*.apk
